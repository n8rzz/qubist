name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: gdformat --check
        run: gdformat --check -l 100 $(git ls-files '*.gd')

      - name: gdlint
        run: gdlint $(git ls-files '*.gd')

  core:
    name: Core tests (Godot ${{ vars.GODOT_VERSION || '4.7.2' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: ${{ vars.GODOT_VERSION || '4.7.2' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download Godot
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o "$name.zip" "$base/$name.zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep "$name.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$name.zip"
          mv "$name" godot
          chmod +x godot
          ./godot --version

      # A fresh checkout has no .godot/ import cache, so resources that
      # scripts preload (the fonts) can't load until the project is imported.
      - name: Import assets
        run: timeout 300 ./godot --headless --path . --import

      - name: Run tests
        run: |
          set -o pipefail
          timeout 300 ./godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee test-output.txt

      - name: Smoke test the game screen
        run: |
          set -o pipefail
          timeout 120 ./godot --headless --path . --script res://tests/smoke_main.gd 2>&1 | tee smoke-output.txt

      - name: Smoke test the loading view
        run: |
          set -o pipefail
          timeout 120 ./godot --headless --path . --script res://tests/smoke_loading.gd 2>&1 | tee loading-output.txt

      - name: Collect the output
        if: always()
        run: |
          # The errors the unit tests trigger on purpose, as whole lines. They
          # are only dropped from the unit test output, along with the "at:"
          # line under each. A test that adds one must list it here.
          cat > expected-errors.txt <<'EOF'
          ERROR: Analytics: unknown event 'player_email'
          ERROR: Analytics: 'game_start' takes [], got ["device"]
          ERROR: Analytics: 'game_over' takes ["score", "moves", "lines"], got ["score"]
          ERROR: analytics test error
          ERROR: Duplicate piece id 'dot'
          ERROR: Piece 'empty_all' has no cells
          ERROR: Piece 'empty' has no cells
          ERROR: expected error from tests/fixtures/crashing_suite.gd
          EOF
          cat test-output.txt 2>/dev/null | awk '
            NR == FNR { expected[$0] = 1; next }
            skip_next == 1 { skip_next = 0; next }
            $0 in expected { skip_next = 1; next }
            { print }
          ' expected-errors.txt - > test-filtered.txt

          # tests/fixtures/ holds a suite that crashes on purpose, so
          # tests/test_suite_runner.gd can check the runner fails a test on a
          # script error. Drop those deliberate errors (the SCRIPT ERROR line
          # and the "at:" line under it). Everything else still counts.
          cat test-filtered.txt smoke-output.txt loading-output.txt 2>/dev/null | awk '
            /SCRIPT ERROR/ { held = $0; next }
            held != "" {
              if ($0 !~ /res:\/\/tests\/fixtures\//) { print held; print }
              held = ""
              next
            }
            { print }
            END { if (held != "") print held }
          ' > all-output.txt

      - name: Report failures as annotations
        if: always()
        run: |
          # Surface each failed check, script error, and engine error on the pull request.
          grep -E "^  - " all-output.txt | sed 's/^  - //' | head -50 | while IFS= read -r line; do
            echo "::error title=Test failed::$line"
          done || true
          grep -E -A2 "SCRIPT ERROR|Parse Error" all-output.txt | head -60 | paste -sd' ' | sed 's/--/\n/g' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Script error::$line"
          done || true
          grep -E "^ERROR:" all-output.txt | head -50 | while IFS= read -r line; do
            echo "::error title=Engine error::$line"
          done || true

      - name: Fail on script errors
        if: always()
        run: |
          # The unit test runner already fails a test on a script error, but
          # the smoke tests and errors outside a test method still rely on
          # this, so treat any script or parse error in the output as a failure.
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" all-output.txt; then
            echo "::error::Godot reported script errors (see above)."
            exit 1
          fi

      - name: Fail on engine errors
        if: always()
        run: |
          # Fail on any engine ERROR: line. These are unexpected: the Collect
          # step above already dropped the ones tests trigger on purpose.
          if grep -E "^ERROR:" all-output.txt; then
            echo "::error::Godot reported engine errors (see above)."
            exit 1
          fi
